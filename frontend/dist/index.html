    <div class="bd-scene bd-scene-particles">

      <div class="bd-particles" id="bdParticles"></div>
    </div>

      <div class="bd-fireflies" id="bdFireflies"></div>
    </div>
  </div>

  <div class="admin" id="app">
    <header class="adm-header">
      <div class="adm-brand">
        <svg class="adm-brand-icon"><use href="#i-gear"/></svg>
        <div>
          <h1 class="adm-title">Удалённое управление 1С</h1>
          <p class="adm-sub" id="version"></p>
        </div>
      </div>
      <div class="adm-header-actions">
        <button class="pill-btn update-pill" id="update" type="button" hidden><span class="update-dot" id="updateDot"></span>Обновить</button>
        <button class="pill-btn" id="journalToggle" type="button" title="Журнал" aria-label="Показать или скрыть журнал" aria-pressed="true"><svg><use href="#i-panel"/></svg></button>
        <button class="pill-btn" id="backdropButton" type="button" title="Фон окна" aria-label="Фон окна" aria-haspopup="dialog" aria-expanded="false" aria-controls="backdropMenu"><svg><use href="#i-sparkle"/></svg></button>
        <button class="pill-btn" id="themeToggle" type="button" title="Светлая тема" aria-label="Светлая тема" aria-pressed="false"><svg class="ic-sun"><use href="#i-sun"/></svg><svg class="ic-moon"><use href="#i-moon"/></svg></button>
        <div class="bd-menu" id="backdropMenu" role="dialog" aria-label="Фон окна" hidden>
          <p class="bd-menu-title">Фон окна</p>
          <div class="bd-options" role="radiogroup" aria-label="Фон окна">
            <button class="bd-option" type="button" role="radio" data-backdrop="none" aria-checked="true"><span class="bd-swatch bd-swatch-none"></span><span>Без фона</span></button>

            <button class="bd-option" type="button" role="radio" data-backdrop="forest" aria-checked="false"><span class="bd-swatch bd-swatch-forest"><i></i><i></i><i></i></span><span>Лес</span></button>
          </div>
        </div>
      </div>
    </header>

    <div class="adm-body">
      <aside class="side" aria-label="Категории">
        <nav class="side-nav" id="sideNav" role="tablist" aria-orientation="vertical">
          <p class="side-group-title">Управление 1С</p>
          <button class="side-item" role="tab" data-cat="processes" aria-selected="true"><svg><use href="#i-gear"/></svg><span>Процессы 1С</span></button>
          <button class="side-item" role="tab" data-cat="notify" aria-selected="false"><svg><use href="#i-bell"/></svg><span>Оповещения</span></button>
          <button class="side-item" role="tab" data-cat="commands" aria-selected="false"><svg><use href="#i-play"/></svg><span>Команды</span></button>
          <p class="side-group-title">Обслуживание</p>
          <button class="side-item" role="tab" data-cat="programs" aria-selected="false"><svg><use href="#i-box"/></svg><span>Программы</span></button>
          <button class="side-item" role="tab" data-cat="files" aria-selected="false"><svg><use href="#i-file"/></svg><span>Файлы</span></button>
          <button class="side-item" role="tab" data-cat="system" aria-selected="false"><svg><use href="#i-monitor"/></svg><span>О системе</span></button>
        </nav>
      </aside>

      <main class="content">
        <div class="conn" id="conn"></div>
        <div class="cat-host" id="catHost">
          <section class="cat" data-cat="processes" role="tabpanel"></section>
          <section class="cat" data-cat="notify" role="tabpanel" hidden></section>
          <section class="cat" data-cat="commands" role="tabpanel" hidden></section>
          <section class="cat" data-cat="programs" role="tabpanel" hidden></section>
          <section class="cat" data-cat="files" role="tabpanel" hidden></section>
          <section class="cat" data-cat="system" role="tabpanel" hidden></section>
        </div>
      </main>

      <aside class="adm-journal" id="journal">
        <div class="journal-resizer" id="jResizer" role="separator" aria-orientation="vertical" aria-label="Ширина журнала" title="Потяните, чтобы изменить ширину"></div>
        <header class="journal-head">
          <span class="spinner" id="jSpinner" hidden></span>
          <span class="journal-title" id="jStatus">Журнал</span>
          <div class="journal-actions">
            <button class="link-btn" id="jCancel" type="button" hidden>Отменить</button>
            <button class="icon-btn" id="jCopy" type="button" title="Копировать журнал"><svg><use href="#i-copy"/></svg></button>
            <button class="icon-btn" id="jClear" type="button" title="Очистить"><svg><use href="#i-trash"/></svg></button>
            <button class="icon-btn" id="jCollapse" type="button" title="Скрыть журнал"><svg><use href="#i-right"/></svg></button>
          </div>
        </header>
        <div class="journal-log" id="jLog" role="log" aria-live="polite" tabindex="0"></div>
      </aside>
    </div>
  </div>

  <dialog class="sheet" id="updateSheet">
    <form method="dialog" class="sheet-body">
      <h2 class="sheet-title" id="sheetTitle"></h2>
      <p class="sheet-text" id="sheetText"></p>
      <p class="sheet-notes" id="sheetNotes"></p>
      <div class="sheet-progress" id="sheetProgress" hidden><div class="sheet-bar" id="sheetBar"></div></div>
      <p class="sheet-error" id="sheetError" role="alert"></p>
      <div class="sheet-actions">
        <button class="btn" value="cancel" id="sheetCancel">Позже</button>
        <button class="btn btn-primary" type="button" id="sheetConfirm">Обновить и перезапустить</button>
      </div>
    </form>
  </dialog>

  <dialog class="sheet" id="confirmSheet">
    <form method="dialog" class="sheet-body">
      <h2 class="sheet-title" id="confirmTitle"></h2>
      <p class="sheet-text" id="confirmText"></p>
      <div class="sheet-actions">
        <button class="btn" value="cancel" id="confirmCancel">Отмена</button>
        <button class="btn btn-danger" type="button" id="confirmOk">Подтвердить</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="alert" hidden><span id="toastText"></span><button class="link-btn toast-action" id="toastAction" type="button" hidden></button></div>
